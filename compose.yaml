name: clinicalsync
services:
  shared-db:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: clinicalsync_shared
      POSTGRES_USER: clinicalsync
      POSTGRES_PASSWORD: ${SHARED_DB_PASSWORD:-synthetic-shared-local-only}
    volumes:
    - shared-data:/var/lib/postgresql/data
    healthcheck:
      test:
      - CMD-SHELL
      - pg_isready -U clinicalsync -d clinicalsync_shared
      interval: 3s
      timeout: 3s
      retries: 20
  northstar-db:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: clinicalsync_northstar
      POSTGRES_USER: northstar
      POSTGRES_PASSWORD: ${NORTHSTAR_DB_PASSWORD:-synthetic-northstar-local-only}
    volumes:
    - northstar-data:/var/lib/postgresql/data
    healthcheck:
      test:
      - CMD-SHELL
      - pg_isready -U northstar -d clinicalsync_northstar
      interval: 3s
      timeout: 3s
      retries: 20
  riverside-db:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: clinicalsync_riverside
      POSTGRES_USER: riverside
      POSTGRES_PASSWORD: ${RIVERSIDE_DB_PASSWORD:-synthetic-riverside-local-only}
    volumes:
    - riverside-data:/var/lib/postgresql/data
    healthcheck:
      test:
      - CMD-SHELL
      - pg_isready -U riverside -d clinicalsync_riverside
      interval: 3s
      timeout: 3s
      retries: 20
  backend:
    build:
      context: .
      dockerfile: backend/Dockerfile
    environment:
      SHARED_DATABASE_URL: postgresql+psycopg://clinicalsync:${SHARED_DB_PASSWORD:-synthetic-shared-local-only}@shared-db:5432/clinicalsync_shared
      HOSPITAL_A_DATABASE_URL: postgresql+psycopg://northstar:${NORTHSTAR_DB_PASSWORD:-synthetic-northstar-local-only}@northstar-db:5432/clinicalsync_northstar
      HOSPITAL_B_DATABASE_URL: postgresql+psycopg://riverside:${RIVERSIDE_DB_PASSWORD:-synthetic-riverside-local-only}@riverside-db:5432/clinicalsync_riverside
      DEMO_PASSWORD: ${DEMO_PASSWORD:-ClinicalSync-demo-2026!}
      DEMO_MODE: ${DEMO_MODE:-true}
      SECURE_COOKIE: ${SECURE_COOKIE:-false}
      ALLOWED_ORIGINS: ${ALLOWED_ORIGINS:-http://localhost:3000,http://127.0.0.1:3000}
      TRANSCRIPTION_PROVIDER: ${TRANSCRIPTION_PROVIDER:-manual}
      NOTE_GENERATION_PROVIDER: ${NOTE_GENERATION_PROVIDER:-local}
      AI_EXTERNAL_ENABLED: ${AI_EXTERNAL_ENABLED:-false}
      AI_API_KEY: ${AI_API_KEY:-}
      AI_BASE_URL: ${AI_BASE_URL:-https://api.openai.com/v1}
      TRANSCRIPTION_MODEL: ${TRANSCRIPTION_MODEL:-gpt-4o-mini-transcribe}
      NOTE_MODEL: ${NOTE_MODEL:-gpt-4.1-mini}
      TRANSCRIPT_RETENTION_DAYS: ${TRANSCRIPT_RETENTION_DAYS:-7}
      AUDIO_MAX_BYTES: ${AUDIO_MAX_BYTES:-15728640}
    ports:
    - 127.0.0.1:8000:8000
    depends_on:
      shared-db:
        condition: service_healthy
      northstar-db:
        condition: service_healthy
      riverside-db:
        condition: service_healthy
    healthcheck:
      test:
      - CMD
      - python
      - -c
      - import urllib.request; urllib.request.urlopen('http://localhost:8000/api/health')
      interval: 5s
      timeout: 3s
      retries: 20
  frontend:
    build:
      context: .
      dockerfile: frontend/Dockerfile
    ports:
    - 127.0.0.1:3000:3000
    depends_on:
      backend:
        condition: service_healthy
volumes:
  shared-data: null
  northstar-data: null
  riverside-data: null
